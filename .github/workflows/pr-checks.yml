name: PR Checks

# Build the app and run the full XCTest suite on every PR targeting `main`,
# and on every push to `main` itself (post-merge verification: PRs are
# squash-merged without a "branch up to date" requirement, so the commit that
# lands on `main` may never have been tested as merged — see docs/ci.md).
#
# This workflow uses NO secrets and must never gain any — PRs run on the
# fork-safe `pull_request` trigger (never `pull_request_target`), and the
# `push` trigger fires only for `main`, i.e. only for code that has already
# been reviewed and merged. Anything involving signing or releasing lives
# exclusively in testflight.yml.
#
# The job below surfaces as the status check "Build & Test", intended as the
# required check guarding merges to `main` (a repo admin enables the ruleset
# once — see docs/ci.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One run per PR (or per branch for push events); a new push cancels the
# in-flight run.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # "Build & Test" is the merge-guard status check on `main` (see docs/ci.md).
    # Renaming this job breaks the guard until the ruleset is updated.
    name: Build & Test
    runs-on: macos-latest
    # Unit/rendering tests and isolated checklist UI tests; the cap catches hangs.
    timeout-minutes: 30

    steps:
      # Actions are pinned to full commit SHAs (not mutable tags) so a moved or
      # compromised tag can't change what runs here — see docs/ci.md. The
      # trailing comment records the human-readable version; dependabot
      # (.github/dependabot.yml) opens bump PRs that keep both in sync.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Match testflight.yml so PR checks and releases build with the same Xcode.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # Formatting gate — sources are formatted with Apple's swift-format
      # (bundled with the Xcode/Swift 6 toolchain; config in .swift-format).
      # Runs the formatter and fails on any resulting diff, prettier-style.
      # CI's toolchain is the canonical formatter: if a runner-image Xcode bump
      # changes swift-format's output, land a standalone tree-wide reformat
      # commit (see docs/ci.md "Toolchain drift").
      - name: Check formatting
        run: |
          swift format --version
          swift format --recursive --in-place Schrift SchriftTests SchriftUITests
          if ! git diff --exit-code -- '*.swift'; then
            echo "::error::Swift sources are not formatted. Run: swift format --recursive --in-place Schrift SchriftTests SchriftUITests"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # The Xcode project is generated from project.yml and not committed —
      # CI must regenerate it before any xcodebuild call (see AGENTS.md).
      - name: Generate Xcode project
        run: xcodegen generate

      # Runner images change their simulator lineup over time. Prefer the
      # documented "iPhone 17", fall back to any available iPhone simulator.
      # JSON + jq (preinstalled) so device names containing parentheses
      # (e.g. "iPhone SE (3rd generation)") are extracted intact.
      - name: Pick an iPhone simulator
        id: sim
        run: |
          # `|| true`: grep exits 1 when no iPhone matches; the empty-check
          # below owns that failure so the device-list diagnostic still prints
          # even if this step ever runs under a pipefail shell.
          names="$(xcrun simctl list -j devices available \
            | jq -r '.devices[][] | select(.isAvailable) | .name' \
            | grep '^iPhone' | sort -u || true)"
          device="$(printf '%s\n' "$names" | grep -x 'iPhone 17' || true)"
          [ -n "$device" ] || device="$(printf '%s\n' "$names" | head -n 1)"
          if [ -z "$device" ]; then
            echo "No iPhone simulator available on this runner:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          # Resolve the name to one device (on the newest iOS runtime) so the
          # boot step below and xcodebuild target the same simulator.
          udid="$(xcrun simctl list -j devices available | jq -r --arg name "$device" '
            [.devices | to_entries[]
             | select(.key | test("\\.SimRuntime\\.iOS-[0-9-]+$"))
             | (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)) as $v
             | .value[] | select(.isAvailable and .name == $name) | {v: $v, udid}]
            | sort_by(.v) | last | .udid // empty')"
          if [ -z "$udid" ]; then
            echo "No iOS runtime found for simulator: $device" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $device ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Start the simulator booting now and only wait for it after the build:
      # a cold boot takes about two minutes on a hosted runner, and the build
      # doesn't need a running device, so the two overlap instead of queueing.
      # `simctl boot` returns once the boot has been started (and fails if the
      # device is already booted, which is fine here).
      - name: Start booting simulator
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: xcrun simctl boot "$SIM_UDID" || true

      # Xcode's compilation cache (content-addressed, so it survives a fresh
      # checkout, unlike DerivedData's mtime-based incremental state) persisted
      # with actions/cache. A PR's later pushes restore that PR's newest cache;
      # its first push falls back to the newest one `main` saved. The key
      # carries the Xcode version because cached outputs are toolchain-specific.
      - name: Read Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore compilation cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: compilation-cache-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: |
            compilation-cache-${{ steps.xcode.outputs.version }}-

      # Build once, then test the built products. Code coverage is off because
      # nothing in CI reads it (it instruments every target and slows both the
      # build and the run), and so is the index store, which only serves an IDE.
      # Simulator builds ad-hoc sign (no certificates or Team ID needed).
      # Do NOT disable code signing: the Keychain tests need the test host's
      # ad-hoc signature/entitlements, and SecItem calls fail with
      # errSecMissingEntitlement (-34018) in a fully unsigned test host.
      - name: Build for testing
        # Passed via env (not inline ${{ }}) to keep dynamic text out of the
        # script body, matching the repo's no-interpolation convention.
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          # xcbeautify is preinstalled on GitHub macOS images; fall back to
          # raw output if an image ever drops it (no extra installs).
          formatter=cat
          command -v xcbeautify >/dev/null && formatter=xcbeautify
          xcodebuild build-for-testing \
            -project Schrift.xcodeproj \
            -scheme Schrift \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -enableCodeCoverage NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/CompilationCache" \
            | "$formatter"
          du -sh "$RUNNER_TEMP/CompilationCache" || true

      # Wait until the simulator has finished booting before any test runs.
      # Left to xcodebuild, the first UI test can land on a simulator still
      # settling from a cold boot: a hosted run spent 5s in XCTest's
      # interruption check and the switch press that followed never registered
      # (ChecklistFilterTests, run 37733961599; the cold boot is the suspected,
      # not confirmed, cause). `bootstatus -b` boots the device if needed and
      # blocks until boot (including data migration) completes.
      - name: Wait for simulator boot
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Test
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          formatter=cat
          command -v xcbeautify >/dev/null && formatter=xcbeautify
          xcodebuild test-without-building \
            -project Schrift.xcodeproj \
            -scheme Schrift \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults.xcresult \
            | "$formatter"

      # The result bundle is only interesting when something failed.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
