name: TestFlight

# Every merge to `main` ships a build to TestFlight, fully automatically:
#
#   1. compute the next Conventional-Commits version from the latest `v*` tag
#      (scripts/next-version.sh) — feat: -> minor, feat!/BREAKING -> major,
#      anything else -> patch, so every merge bumps at least a patch;
#   2. build a signed Release archive and upload it to TestFlight, using the
#      computed marketing version and the run number as the (monotonic) build
#      number;
#   3. on a successful upload, tag the commit `v<version>` and cut a GitHub
#      Release with auto-generated notes.
#
# The tag is an OUTPUT of this pipeline, not a trigger for it: the tag push
# uses the default GITHUB_TOKEN, and pushes made with that token do not start
# new workflow runs — so there is no release loop. Nothing is committed back to
# `main` (the version is derived from tags), so the push trigger can't loop
# either. You can still ship manually from the Actions tab (workflow_dispatch);
# add `[skip ci]` to a commit message to skip a build.
#
# Signing material and ASC credentials come from the 1Password `Schrift` vault,
# read by a service account whose token (OP_SERVICE_ACCOUNT_TOKEN) is the only
# GitHub secret used here (docs/testflight-setup.md).
#
# NOTE: never add a `pull_request` / `pull_request_target` trigger here — it
# would expose the 1Password token (and so the signing secrets) to fork PRs.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases so two quick merges don't race on the tag or build number.
concurrency:
  group: testflight-release
  cancel-in-progress: false

# Required to push the version tag and create the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    name: Build & upload to TestFlight
    runs-on: macos-latest
    # Generous because the upload waits for Apple to finish processing the build
    # (so it can attach release notes + distribute to testers) before returning.
    timeout-minutes: 90

    env:
      # --- Build metadata ---
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      # This workflow holds signing secrets, so actions are pinned to full
      # commit SHAs (not mutable tags): a moved or compromised third-party tag
      # would otherwise run inside a job that can read them. The trailing comment
      # records the version; dependabot (.github/dependabot.yml) bumps both. See
      # docs/ci.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history + tags so scripts/next-version.sh can find the
          # latest v* tag and the commits since it.
          fetch-depth: 0

      - name: Compute version & release notes
        id: version
        run: |
          # Without `pipefail` a failing `git tag --list` degrades silently to
          # "no tags", which reads as a never-released repo: whole-history release
          # notes, and a version that marches backwards. The tag lookup below is
          # therefore written without a pipe at all, so it can neither swallow a
          # git failure nor trip over SIGPIPE from an early-closing `head`.
          set -euo pipefail

          version="$(bash scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next release version: $version (build ${BUILD_NUMBER})"

          # Release notes = commit subjects since the last tag. Written to a
          # file that fastlane reads — the (attacker-controllable) commit text
          # is never interpolated into a shell command or a $GITHUB_OUTPUT
          # heredoc, so it can't inject anything.
          tags="$(git tag --list 'v*' --sort=-v:refname)"
          last_tag="${tags%%$'\n'*}"
          range="${last_tag:+$last_tag..}HEAD"
          {
            echo "v$version (build ${BUILD_NUMBER})"
            echo
            git log "$range" --no-merges --format='- %s' | head -n 50
          } > release-notes.txt
          echo "Release notes:"; cat release-notes.txt

      # Match the Xcode version to what you build with locally.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          # Ruby version is read from .ruby-version (kept in sync with local dev)
          bundler-cache: true

      # Signing material and App Store Connect credentials live in the 1Password
      # `Schrift` vault; the one GitHub secret is the (read-only, vault-scoped)
      # service account token. The script masks every value and exports them via
      # $GITHUB_ENV for the fastlane steps below.
      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Fetch signing material from 1Password
        run: bash scripts/fetch-signing.sh "$RUNNER_TEMP/signing"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Build & upload
        id: upload
        run: bundle exec fastlane beta
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}

      # The tag + release steps only run if the build & upload above succeeded,
      # so a failed build never burns a version number.
      #
      # Both are idempotent, because a re-run has to be able to *finish* a release
      # rather than die on its own leftovers: the upload step now succeeds when the
      # binary is already on App Store Connect, which is exactly the state a re-run
      # of a half-finished release is in. Dying on "tag already exists" there would
      # put the pipeline back where it started.
      - name: Tag the release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag is already on origin — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `fetch-depth: 0` brings tags with it, so the tag may already exist
          # locally even when origin doesn't have it.
          git tag -a "$tag" -m "Release $tag" 2>/dev/null \
            || echo "Tag $tag already exists locally — pushing that."
          git push origin "$tag"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists — nothing to do."
            exit 0
          fi
          gh release create "v${version}" \
            --title "v${version}" \
            --generate-notes \
            --target "${{ github.sha }}"

      # Last, and deliberately so. Attaching the release notes and handing the
      # build to testers both need a build Apple has finished *processing*, which
      # has no upper bound — build 96 was still processing 30 minutes after it was
      # uploaded. Running it before the tag would mean a cancel or a job timeout
      # during that wait costs the release record for a build that already
      # shipped, which is the incident this whole workflow change is about.
      #
      # The lane already downgrades its own failures to warnings;
      # `continue-on-error` is the second belt.
      - name: Attach release notes & distribute
        if: steps.upload.outputs.build_number != ''
        continue-on-error: true
        run: bundle exec fastlane distribute
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER_TO_DISTRIBUTE: ${{ steps.upload.outputs.build_number }}
          RELEASE_NOTES_FILE: ${{ github.workspace }}/release-notes.txt
          # Optional: comma-separated TestFlight beta group names to also
          # distribute to (internal testers already get every build).
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            *.ipa
            fastlane/report.xml
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
          retention-days: 7
          # Artifacts are scoped to the run, not the attempt, so on a re-run this
          # step would 409 on the previous attempt's artifact and — being
          # `if: always()` — become the last red step a maintainer sees, pointing
          # triage away from the real failure.
          overwrite: true
