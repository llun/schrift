<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Schrift — Soft relief v2 (background)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7F7CF7"/><stop offset="0.5" stop-color="#5F5BE0"/><stop offset="1" stop-color="#3F39B6"/></linearGradient>
    <radialGradient id="glow" cx="170" cy="120" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- face: light from the upper-left, across the nib -->
    <linearGradient id="face" x1="-220" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1EFFE"/>
    </linearGradient>
    <linearGradient id="relief" x1="0" y1="0" x2="0" y2="-1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6D3FC"/><stop offset="1" stop-color="#ABA6F2"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g transform="translate(205 819) rotate(45) scale(1.08)" fill="#000"><path d="M0 -458 a56 56 0 1 0 0 112 a56 56 0 1 0 0 -112 Z"/><path d="M-10 -400 L10 -400 L2.2 -84 Q0 -74 -2.2 -84 Z"/></g>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
</svg>
